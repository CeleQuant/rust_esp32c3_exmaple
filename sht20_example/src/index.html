<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta http-equiv='content-type' content='text/html; charset=UTF-8' />
    <style>
        #content,
        .login,
        .login-card a,
        .login-card h1,
        .login-help {
            text-align: center
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: table
        }

        #content {
            font-family: 'Source Sans Pro', sans-serif;
            -webkit-background-size: cover;
            -moz-background-size: cover;
            -o-background-size: cover;
            background-size: cover;
            display: table-cell;
            vertical-align: middle
        }

        .login-card {
            padding: 40px;
            width: 274px;
            background-color: #F7F7F7;
            margin: 0 auto 10px;
            border-radius: 20px;
            box-shadow: 8px 8px 15px rgba(0, 0, 0, .3);
            overflow: hidden
        }

        .login-card h1 {
            font-weight: 400;
            font-size: 2.3em;
            color: #1383c6
        }

        .login-card h1 span {
            color: #f26721
        }

        .login-card img {
            width: 70%;
            height: 70%
        }

        .login-card input[type=submit] {
            width: 100%;
            display: block;
            margin-bottom: 10px;
            position: relative
        }

        .login-card input[type=text],
        input[type=password] {
            height: 44px;
            font-size: 16px;
            width: 100%;
            margin-bottom: 10px;
            -webkit-appearance: none;
            background: #fff;
            border: 1px solid #d9d9d9;
            border-top: 1px solid silver;
            padding: 0 8px;
            box-sizing: border-box;
            -moz-box-sizing: border-box
        }

        .login-card input[type=text]:hover,
        input[type=password]:hover {
            border: 1px solid #b9b9b9;
            border-top: 1px solid #a0a0a0;
            -moz-box-shadow: inset 0 1px 2px rgba(0, 0, 0, .1);
            -webkit-box-shadow: inset 0 1px 2px rgba(0, 0, 0, .1);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, .1)
        }

        .login {
            font-size: 14px;
            font-family: Arial, sans-serif;
            font-weight: 700;
            height: 36px;
            padding: 0 8px
        }

        .login-submit {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            border: 0;
            color: #fff;
            text-shadow: 0 1px rgba(0, 0, 0, .1);
            background-color: #4d90fe
        }

        .login-submit:disabled {
            opacity: .6
        }

        .login-submit:hover {
            border: 0;
            text-shadow: 0 1px rgba(0, 0, 0, .3);
            background-color: #357ae8
        }

        .login-card a {
            text-decoration: none;
            color: #666;
            font-weight: 400;
            display: inline-block;
            opacity: .6;
            transition: opacity ease .5s
        }

        .login-card a:hover {
            opacity: 1
        }

        .login-help {
            width: 100%;
            font-size: 12px
        }

        .list {
            list-style-type: none;
            padding: 0
        }

        .list__item {
            margin: 0 0 .7rem;
            padding: 0
        }

        label {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            text-align: left;
            font-size: 14px;
        }

        input[type=checkbox] {
            -webkit-box-flex: 0;
            -webkit-flex: none;
            -ms-flex: none;
            flex: none;
            margin-right: 10px;
            float: left
        }

        .error {
            font-size: 14px;
            font-family: Arial, sans-serif;
            font-weight: 700;
            height: 25px;
            padding: 0 8px;
            padding-top: 10px;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            border: 0;
            color: #fff;
            text-shadow: 0 1px rgba(0, 0, 0, .1);
            background-color: #ff1215
        }

        .shortselect {
            background: #fafdfe;
            height: 45px;
            width: 100%;
            line-height: 45px;
            padding-left: 10px;
            padding-right: 10px;
            font-size: 14px;
            border: 1px solid #9bc0dd;
            -moz-border-radius: 2px;
            -webkit-border-radius: 2px;
            border-radius: 2px;
        }

        @media screen and (max-width:450px) {
            .login-card {
                width: 70% !important
            }

            .login-card img {
                width: 30%;
                height: 30%
            }
        }
    </style>
</head>

<body style='background-color: #e5e9f2'>
    <div id='content'>
        <span id='ssids' style="display:none;">{{ssids}}</span>
        <div class='login-card'>
            <h1 id='title'>WiFi 配网</h1>
            <form name='login_form' method='post' action='wifi'>
                <!-- <input type='text' name='ssid' required placeholder='请输入 WiFi 名称' id='auth_user' list='data-list'
                    style='border-radius: 10px'> -->
                <select name='ssid' required placeholder='请输入 WiFi 名称' id='auth_user' class="shortselect"
                    style='border-radius: 10px;margin-top: 15px;'>
                    <!-- <option value="">请选择wifi</option> -->
                </select>
                <input type='password' required name='password' placeholder='请输入 WiFi 密码' id='auth_pass'
                    style='border-radius: 10px;margin-top: 15px;'>
                <input type='submit' class='login login-submit' value='确认' id='login'
                    style='border-radius: 15px;margin-top: 15px;'>
            </form>
            <div style='display:flex;align-items:center;justify-content: center;margin-top:20px;font-size: 20px;'>
                <span style='font-weight: bolder;color:#4d90fe' id='cn_link'>中文</span>
                <span style='width:50px'></span>
                <span style='color:#999' id='en_link'>English</span>
            </div>
        </div>
</body>
<script>
    let ssids = document.getElementById('ssids').innerText;
    let title = document.getElementById('title');
    let login = document.getElementById('login');
    let auth_user = document.getElementById('auth_user');
    let auth_pass = document.getElementById('auth_pass');
    let en_link = document.getElementById('en_link');
    let cn_link = document.getElementById('cn_link');
    let ssid_list = JSON.parse(ssids);
    console.log(ssid_list)
    auth_user.innerHTML = ``;
    for (let i = 0; i < ssid_list.length; i++) {
        auth_user.innerHTML += `<option value="${ssid_list[i]}">${ssid_list[i]}</option>`
    }
    en_link.onclick = () => {
        en_link.style.color = '#4d90fe'
        cn_link.style.color = '#999'
        title.innerText = 'WiFI Setting'
        login.setAttribute('value', 'OK')
        auth_user.setAttribute('placeholder', 'WiFI Name')
        auth_pass.setAttribute('placeholder', 'WiFI Password')
    }
    cn_link.onclick = () => {
        cn_link.style.color = '#4d90fe'
        en_link.style.color = '#999'
        title.innerText = 'WiFI 配网'
        login.setAttribute('value', '确认')
        auth_user.setAttribute('placeholder', '请输入 WiFi 名称')
        auth_pass.setAttribute('placeholder', '请输入 WiFi 密码')
    }
</script>

</html>
